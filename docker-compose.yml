# Local dev. Both services point at Neon (a dev branch, ideally — see
# backend/.env.example) rather than running Postgres in a container here,
# since Neon's free tier is always reachable and this keeps local dev and
# prod on the identical DB engine with zero extra moving parts.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      args:
        # Local-only value — matches the backend port above. Render sets
        # its own VITE_API_URL build arg from the dashboard env var, this
        # one never touches prod.
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:8080"
    depends_on:
      - backend
