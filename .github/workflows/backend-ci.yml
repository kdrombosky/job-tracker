name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    # ubuntu-latest ships Docker preinstalled and running — testcontainers
    # needs that to spin up the real Postgres the tests run against.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        # python -m pytest (not bare `pytest`) also adds the cwd to
        # sys.path, as a second, independent fix for the same import issue
        # pytest.ini's `pythonpath = .` already solves.
        run: python -m pytest -v
